# Install once, in the repo folder, with the conda environment master active:
#
#     pip install -e .

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ospfmusim"
authors = [
  { name="Olve Grønås Birkeland", email="olvebirkeland@icloud.com"}
]
description = "DP co-simulation of vessels with Python FMUs in OSP"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dynamic = ["version", "dependencies"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]

keywords = ["dynamic positioning", "co-simulation", "fmu", "osp", "marine", "vessel"]

[project.urls]
Homepage = "https://github.com/Olvegb/Gunnerus_OSP"
Repository = "https://github.com/Olvegb/Gunnerus_OSP.git"
Documentation = "https://github.com/Olvegb/Gunnerus_OSP/tree/main/docs"
Issues = "https://github.com/Olvegb/Gunnerus_OSP/issues"
Source = "https://github.com/Olvegb/Gunnerus_OSP"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.package-data]
# Files that are not .py but are needed: the system structure and the hull data.
ospfmusim = ["OspSystemStructure.xml", "hull/helpfunctions/*.json", "hull/helpfunctions/LICENSE"]

[tool.setuptools_scm]
# Basic setuptools-scm config: derive version from git tags.
# No write_to/version_file needed; importlib.metadata reads dist metadata.
version_scheme = 'post-release'
