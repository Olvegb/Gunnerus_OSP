# =====================================================================
#  CONFIG FILE FOR THE WHOLE SIMULATION
# =====================================================================
# Every constant the simulation needs is here, and only here.
#
# Change a number, save, and run the simulation again. You do NOT need
# to rebuild the FMU, because the FMU reads this file every time the
# simulation starts.
#
# This file is read by:
#   - the Environment FMU (sections [wind] and [waves])
#   - the Waves FMU (section [waves] and its sub-sections)
#   - the WindLoads FMU (sections [environment], [vessel] and [blendermann])
#   - the ExtendedKalmanFilter FMU (sections [vessel] and [kalman_filter])
#   - the ThrustAllocation and ThrusterDynamics FMUs (sections [allocation],
#     [[power_sources]] and [[thrusters]], through thruster_cosim/layout.py)
#   - run_simulation.py (section [simulation])
#
# The format is TOML: [section], then  name = value.
# Everything after # is a comment.
# =====================================================================


[simulation]
duration = 10.0             # how long the simulation runs [s]


# Read by the Test FMU (models/test.py). Only there to illustrate the set-up.
[test]
test = 2.0                  # output = input * test


[environment]
air_density = 1.226         # air density [kg/m^3], DNV-ST-0111 [3.5]


# Read by the Environment FMU. All wind outputs are in the NED frame.
#   wind speed     = mean + slowly varying + gust
#   wind direction = mean + rate * t + slowly varying
# A part is switched off by setting it to 0: std = 0, n_components = 0,
# or rate_deg_per_s = 0 and std_deg = 0.
[wind]
mean_speed = 15             # mean wind speed (1-hour mean) [m/s]
direction_deg = 90.0        # mean direction the wind comes from, clockwise from north [deg]
reference_height = 10.0     # height the wind speed is given for [m]
seed = 1                    # random seed; same seed = same wind every run

# Slowly varying wind speed: first-order Gauss-Markov process.
[wind.slowly_varying]
time_constant = 300.0       # T, how slowly it changes [s]
std = 1.0                   # standard deviation [m/s]

# Gusts: sum of harmonics from the NORSOK N-003 / ISO 19901-1 (Froya) spectrum.
# f_min should lie above the slowly varying band (about 1/(2 pi T) Hz),
# so the two parts do not model the same frequencies twice.
[wind.gust]
f_min = 0.005               # lowest frequency [Hz]
f_max = 0.5                 # highest frequency [Hz]
n_components = 100          # number of harmonics

# Gradual change of the wind direction.
[wind.direction_variation]
rate_deg_per_s = 0.0        # constant turning rate, clockwise positive [deg/s]
time_constant = 600.0       # T of the slow random variation [s]
std_deg = 5.0               # standard deviation of the slow random variation [deg]


# hs, tp and direction_deg are read by the Environment FMU, which sends them
# on to the Waves FMU. The rest of [waves] is read by the Waves FMU
# (models/waves.py), which turns the sea state into wave components.
#   sea_type = "regular":   ONE regular wave with height H = hs and period T = tp,
#                           travelling in the mean direction. [waves.spectrum],
#                           [waves.spreading] and [waves.discretization] are not used.
#   sea_type = "irregular": a sea made from a wave spectrum. [waves.spreading] type
#                           decides if it is long-crested ("none") or short-crested ("cos2s").
[waves]
hs = 3.1                    # significant wave height H_s [m]  (regular sea: wave height H)
tp = 8.5                    # peak wave period T_p [s]         (regular sea: wave period T)
direction_deg = 45.0        # where the waves come from, clockwise from north [deg]
sea_type = "irregular"      # "regular" or "irregular"
seed = 123                  # random seed for phases, frequencies, directions; same seed = same sea

# Wave spectrum (Sørensen 6.2.1, DNV-RP-C205).
[waves.spectrum]
type = "jonswap"            # "jonswap" or "pierson_moskowitz"
gamma = 3.3                 # JONSWAP peak factor (not used for "pierson_moskowitz")

# Directional spreading, D(theta) = cos^(2s) around the mean direction.
[waves.spreading]
type = "cos2s"              # "none" = long-crested, "cos2s" = short-crested
s = 1                       # spreading exponent: 1 = cos^2 (ITTC/DNV), 2 = ISSC. Higher = narrower
n_directions = 11           # number of direction bins
direction_limit_deg = 90.0  # use directions within +- this angle of the mean [deg]

# How the spectrum is split into wave components. The grid has
# n_frequencies x n_directions components; the Waves FMU sends out the
# N_WAVES (models/waves.py) with the most energy.
[waves.discretization]
n_frequencies = 30          # number of frequency bins
omega_min_factor = 0.25     # lowest frequency  = factor * peak frequency
omega_max_factor = 3.0      # highest frequency = factor * peak frequency
random_frequencies = true   # random frequency inside each bin (the wave groups do not repeat)
random_directions = true    # random direction inside each bin


[vessel]
type = "offshore_supply_vessel"  # must be one of the names under [blendermann]
loa = 88.0                  # length over all [m]
area_lateral = 700.0        # lateral area above water, A_L,wind [m^2]
area_frontal = 280.0        # frontal area above water, A_F,wind [m^2]
s_L = 12.0                  # longitudinal position of the lateral area centre [m]
s_H = 3.0                   # height of the lateral area centre above the waterline [m]

# 3-DOF model matrices [surge, sway, yaw]. Used by the Kalman filter, and
# later by a hull FMU. PLACEHOLDER values for an 88 m OSV (m = 6000 t),
# not identified data:
#   mass_matrix    = rigid-body mass + added mass [kg, kg, kg m^2]
#   damping_matrix = linear damping, chosen so that M/D is about 100 s
#                    in surge and 50 s in sway and yaw [kg/s, kg/s, kg m^2/s]
mass_matrix = [
    [6.6e6, 0.0,   0.0  ],
    [0.0,   9.0e6, 0.0  ],
    [0.0,   0.0,   4.5e9],
]
damping_matrix = [
    [6.6e4, 0.0,   0.0  ],
    [0.0,   1.8e5, 0.0  ],
    [0.0,   0.0,   9.0e7],
]


# Read by the ExtendedKalmanFilter FMU.
# State order: [north, east, psi, u, v, r, b_x, b_y, b_n]
# Measurement order: [north, east, psi]
[kalman_filter]
bias_time_constants = [1000.0, 1000.0, 1000.0]   # T_b [s]
# Process noise Q (diagonal, per second). Larger = trust the model less.
process_noise = [1e-4, 1e-4, 1e-6,   1e-4, 1e-4, 1e-7,   1e7, 1e7, 1e10]
# Measurement noise R (diagonal) = std^2: GNSS 0.5 m, gyro 0.5 deg.
measurement_noise = [0.25, 0.25, 7.6e-5]
# Initial covariance P0 (diagonal). The bias starts unknown: std 1e5 N, 1e6 Nm.
initial_covariance = [1.0, 1.0, 0.01,   0.1, 0.1, 1e-4,   1e10, 1e10, 1e12]


# Blendermann (1994), Table 1. The FMU uses the row with the same name
# as  type  under [vessel].
[blendermann]
car_carrier                    = { cd_t = 0.95, cd_lAF_bow = 0.55, cd_lAF_stern = 0.60,  delta = 0.80, kappa = 1.2 }
cargo_vessel_loaded            = { cd_t = 0.85, cd_lAF_bow = 0.65, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 1.7 }
cargo_vessel_container_on_deck = { cd_t = 0.85, cd_lAF_bow = 0.55, cd_lAF_stern = 0.50,  delta = 0.40, kappa = 1.4 }
container_ship_loaded          = { cd_t = 0.90, cd_lAF_bow = 0.55, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 1.4 }
destroyer                      = { cd_t = 0.85, cd_lAF_bow = 0.60, cd_lAF_stern = 0.65,  delta = 0.65, kappa = 1.1 }
diving_support_vessel          = { cd_t = 0.90, cd_lAF_bow = 0.60, cd_lAF_stern = 0.80,  delta = 0.55, kappa = 1.7 }
drilling_vessel                = { cd_t = 1.00, cd_lAF_bow = 0.85, cd_lAF_stern = 0.925, delta = 0.10, kappa = 1.7 }
ferry                          = { cd_t = 0.90, cd_lAF_bow = 0.45, cd_lAF_stern = 0.50,  delta = 0.80, kappa = 1.1 }
fishing_vessel                 = { cd_t = 0.95, cd_lAF_bow = 0.70, cd_lAF_stern = 0.70,  delta = 0.40, kappa = 1.1 }
lng_tanker                     = { cd_t = 0.70, cd_lAF_bow = 0.60, cd_lAF_stern = 0.65,  delta = 0.50, kappa = 1.1 }
offshore_supply_vessel         = { cd_t = 0.90, cd_lAF_bow = 0.55, cd_lAF_stern = 0.80,  delta = 0.55, kappa = 1.2 }
passenger_liner                = { cd_t = 0.90, cd_lAF_bow = 0.40, cd_lAF_stern = 0.40,  delta = 0.80, kappa = 1.2 }
research_vessel                = { cd_t = 0.85, cd_lAF_bow = 0.55, cd_lAF_stern = 0.65,  delta = 0.60, kappa = 1.4 }
speed_boat                     = { cd_t = 0.90, cd_lAF_bow = 0.55, cd_lAF_stern = 0.60,  delta = 0.60, kappa = 1.1 }
tanker_loaded                  = { cd_t = 0.70, cd_lAF_bow = 0.90, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 3.1 }
tanker_ballast                 = { cd_t = 0.70, cd_lAF_bow = 0.75, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 2.2 }
tender                         = { cd_t = 0.85, cd_lAF_bow = 0.55, cd_lAF_stern = 0.55,  delta = 0.65, kappa = 1.1 }


# =====================================================================
#  THRUSTERS: read by the ThrustAllocation and ThrusterDynamics FMUs
# =====================================================================
# Frame: Fossen body frame, x forward, y to starboard, z down. Positions
# from the vessel model's body origin (here Lpp/2). Units SI, power in kW,
# angles in degrees. Every key is explained in thruster_cosim/layout.py
# and docs/thruster_fmus.md.
# [[name]] starts one more entry in a list.

[allocation]
flushing_sectors = true     # add the DNV-ST-0111 [3.11.3] flushing sectors (needs diameter)
# When the command is more than the thrusters can give: cost per N of error
# in X and Y, and per Nm of error in N. Equal weights keep the heading first
# (1 N of force error costs as much as 1 Nm of moment error).
tau_weights = [1.0, 1.0, 1.0]


# Switchboards. Leave out every [[power_sources]] for no power limit.
[[power_sources]]
name = "SWBD 1"
available_kw = 3600.0
reserve_fraction = 0.1      # share kept for other consumers

[[power_sources]]
name = "SWBD 2"
available_kw = 3600.0
reserve_fraction = 0.1


# The thrusters: made-up ~80 m PSV, the test vessel of the DNV-ST-0111
# project mirrored into this frame. max_thrust is the DNV [3.9.2] nominal
# thrust, rounded to 100 N. The time constants and turn rates are made up
# but typical; leave them out for a thruster that follows its command at once.
#
# The order matters: the k-th [[thrusters]] entry is slot k in the FMUs
# (thruster1_..., thruster2_...). At most 8 thrusters.

[[thrusters]]
name = "AZ1"                # port azimuth
kind = "azimuth"            # "azimuth", "tunnel" or "shaft_line"
x = -40.0                   # [m]
y = -5.5                    # [m]
max_thrust = 377500.0       # [N]
diameter = 3.0              # [m]
power_kw = 2000.0           # power at max_thrust [kW]
power_supply = [["SWBD 1", 1.0]]
thrust_time_constant = 5.0  # first-order lag of the thrust [s]
max_azimuth_rate = 10.0     # fastest it turns [deg/s]

[[thrusters]]
name = "AZ2"                # starboard azimuth
kind = "azimuth"
x = -40.0
y = 5.5
max_thrust = 377500.0
diameter = 3.0
power_kw = 2000.0
power_supply = [["SWBD 2", 1.0]]
thrust_time_constant = 5.0
max_azimuth_rate = 10.0

[[thrusters]]
name = "BT1"                # bow tunnel; max_thrust pushes to starboard
kind = "tunnel"
x = 31.0
y = 0.0
max_thrust = 135800.0
diameter = 2.0
power_kw = 900.0
power_supply = [["SWBD 1", 1.0]]
thrust_time_constant = 3.0

[[thrusters]]
name = "BT2"
kind = "tunnel"
x = 28.0
y = 0.0
max_thrust = 126900.0
diameter = 2.0
power_kw = 900.0
power_supply = [["SWBD 2", 1.0]]
thrust_time_constant = 3.0
