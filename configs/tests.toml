# =====================================================================
#  CONFIG FILE FOR THE WHOLE SIMULATION
# =====================================================================
# Every constant the simulation needs is here, and only here. Change a
# number, save, and run again: no rebuild needed, since every FMU reads
# this file when the simulation starts.
#
#   Section                              Read by
#   -----------------------------------  ---------------------------------
#   [simulation]                         ospfmusim/run.py
#   [environment] [wind] [current]       Environment FMU
#   [waves]                              Environment FMU (hs, tp, direction)
#                                        and Waves FMU (the rest)
#   [vessel]                             Vessel, DPController, Kalman filter
#   [vessel_fmu]                         Vessel FMU (hydrodynamic data file)
#   [blendermann]                        Vessel FMU (wind loads)
#   [controller]                         DPController FMU
#   [kalman_filter]                      ExtendedKalmanFilter FMU
#   [allocation] [[power_sources]]       ThrustAllocation and ThrusterDynamics
#   [[thrusters]]                        FMUs, through thruster/helpfunctions/layout.py
#
# Conventions:
#   - Frames: NED for the environment, body frame (x forward, y starboard,
#     z down) for the vessel and thrusters.
#   - Angles in degrees, clockwise from north. Wind and waves: where they
#     come FROM. Current: where it flows TO.
#   - [name] starts a section, [[name]] adds one more entry to a list.
#     Everything after # is a comment.
# =====================================================================


# =====================================================================
#  SIMULATION
# =====================================================================

[simulation]
duration = 10.0                 # how long the simulation runs [s]


# =====================================================================
#  ENVIRONMENT
# =====================================================================

[environment]
air_density = 1.226             # [kg/m^3], DNV-ST-0111 [3.5]


# ---------------------------------------------------------------------
#  Wind
# ---------------------------------------------------------------------
#   wind speed     = mean + slowly varying + gust
#   wind direction = mean + rate * t + slowly varying
# Switch a part off by setting it to 0: std = 0, n_components = 0,
# or rate_deg_per_s = 0 and std_deg = 0.

[wind]
mean_speed = 15.0               # mean wind speed, 1-hour mean [m/s]
direction_deg = 90.0            # mean direction the wind comes from [deg]
reference_height = 10.0         # height the wind speed is given for [m]
seed = 1                        # random seed; same seed = same wind

# Slowly varying wind speed: first-order Gauss-Markov process.
[wind.slowly_varying]
time_constant = 300.0           # T, how slowly it changes [s]
std = 1.0                       # standard deviation [m/s]

# Gusts: harmonics from the NORSOK N-003 / ISO 19901-1 (Froya) spectrum.
# Keep f_min above the slowly varying band (about 1/(2 pi T) Hz), so the
# two parts do not model the same frequencies twice.
[wind.gust]
f_min = 0.005                   # lowest frequency [Hz]
f_max = 0.5                     # highest frequency [Hz]
n_components = 100              # number of harmonics

# Gradual change of the wind direction.
[wind.direction_variation]
rate_deg_per_s = 0.0            # constant turning rate, clockwise positive [deg/s]
time_constant = 600.0           # T of the slow random variation [s]
std_deg = 5.0                   # standard deviation of the slow random variation [deg]


# ---------------------------------------------------------------------
#  Waves
# ---------------------------------------------------------------------
#   sea_type = "regular":   ONE regular wave with height H = hs and period
#                           T = tp, in the mean direction. The sub-sections
#                           below are not used.
#   sea_type = "irregular": a sea made from a wave spectrum, long-crested
#                           or short-crested depending on [waves.spreading].

[waves]
hs = 3.1                        # significant wave height H_s [m]  (regular: wave height H)
tp = 8.5                        # peak wave period T_p [s]         (regular: wave period T)
direction_deg = 45.0            # where the waves come from [deg]
sea_type = "irregular"          # "regular" or "irregular"
seed = 123                      # random seed; same seed = same sea

# Wave spectrum (Sørensen 6.2.1, DNV-RP-C205).
[waves.spectrum]
type = "jonswap"                # "jonswap" or "pierson_moskowitz"
gamma = 3.3                     # JONSWAP peak factor (not used for "pierson_moskowitz")

# Directional spreading, D(theta) = cos^(2s) around the mean direction.
[waves.spreading]
type = "cos2s"                  # "none" = long-crested, "cos2s" = short-crested
s = 1                           # 1 = cos^2 (ITTC/DNV), 2 = ISSC; higher = narrower
n_directions = 11               # number of direction bins
direction_limit_deg = 90.0      # use directions within +- this angle of the mean [deg]

# How the spectrum is split into n_frequencies x n_directions components.
# The Waves FMU sends out the N_WAVES (waves/waves.py) with the most energy.
[waves.discretization]
n_frequencies = 30              # number of frequency bins
omega_min_factor = 0.25         # lowest frequency  = factor * peak frequency
omega_max_factor = 3.0          # highest frequency = factor * peak frequency
random_frequencies = true       # random frequency inside each bin (wave groups do not repeat)
random_directions = true        # random direction inside each bin


# ---------------------------------------------------------------------
#  Current (constant)
# ---------------------------------------------------------------------

[current]
speed = 0.5                     # current speed [m/s]
direction_deg = 0.0             # where the current flows TO [deg]


# =====================================================================
#  VESSEL
# =====================================================================

[vessel]
type = "offshore_supply_vessel" # must be one of the names under [blendermann]
loa = 88.0                      # length over all [m]
area_lateral = 700.0            # lateral area above water, A_L [m^2]
area_frontal = 280.0            # frontal area above water, A_F [m^2]
s_L = 12.0                      # longitudinal position of the lateral area centre [m]
s_H = 3.0                       # height of the lateral area centre above the waterline [m]

# 3-DOF model matrices [surge, sway, yaw]. PLACEHOLDER values for an 88 m
# OSV (m = 6000 t), not identified data.
#   mass_matrix    = rigid-body mass + added mass [kg, kg, kg m^2]
#   damping_matrix = linear damping, M/D about 100 s in surge and 50 s in
#                    sway and yaw [kg/s, kg/s, kg m^2/s]
mass_matrix = [
    [6.6e6, 0.0,   0.0  ],
    [0.0,   9.0e6, 0.0  ],
    [0.0,   0.0,   4.5e9],
]
damping_matrix = [
    [6.6e4, 0.0,   0.0  ],
    [0.0,   1.8e5, 0.0  ],
    [0.0,   0.0,   9.0e7],
]

# Vessel FMU (hull/vessel.py): 6-DOF LF + WF hull. The JSON file holds the
# 6x6 matrices and hydrodynamic tables; the path is relative to this file.
# SYNTHETIC test data for now, not RV Gunnerus.


# Gunnerus .mat hydrodynamics; shared wind/thruster geometry still needs calibration.
[vessel_fmu]
mat_file = "../data_examples/GunnerusL35_20201112.mat"

# Frequency count, heading step and spacing default to Wamit.py settings.
lf_reference_omega_rad_s = 0.2094395
use_mat_viscous_damping = true

# Select Newman or Sorensen at the top of hull/helpfunctions/WaveLoads.py.
# The selected LF frequency is a fixed-coefficient approximation, not omega=0.




# Blendermann (1994), Table 1. WindLoads uses the row named by [vessel] type.
[blendermann]
car_carrier                    = { cd_t = 0.95, cd_lAF_bow = 0.55, cd_lAF_stern = 0.60,  delta = 0.80, kappa = 1.2 }
cargo_vessel_loaded            = { cd_t = 0.85, cd_lAF_bow = 0.65, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 1.7 }
cargo_vessel_container_on_deck = { cd_t = 0.85, cd_lAF_bow = 0.55, cd_lAF_stern = 0.50,  delta = 0.40, kappa = 1.4 }
container_ship_loaded          = { cd_t = 0.90, cd_lAF_bow = 0.55, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 1.4 }
destroyer                      = { cd_t = 0.85, cd_lAF_bow = 0.60, cd_lAF_stern = 0.65,  delta = 0.65, kappa = 1.1 }
diving_support_vessel          = { cd_t = 0.90, cd_lAF_bow = 0.60, cd_lAF_stern = 0.80,  delta = 0.55, kappa = 1.7 }
drilling_vessel                = { cd_t = 1.00, cd_lAF_bow = 0.85, cd_lAF_stern = 0.925, delta = 0.10, kappa = 1.7 }
ferry                          = { cd_t = 0.90, cd_lAF_bow = 0.45, cd_lAF_stern = 0.50,  delta = 0.80, kappa = 1.1 }
fishing_vessel                 = { cd_t = 0.95, cd_lAF_bow = 0.70, cd_lAF_stern = 0.70,  delta = 0.40, kappa = 1.1 }
lng_tanker                     = { cd_t = 0.70, cd_lAF_bow = 0.60, cd_lAF_stern = 0.65,  delta = 0.50, kappa = 1.1 }
offshore_supply_vessel         = { cd_t = 0.90, cd_lAF_bow = 0.55, cd_lAF_stern = 0.80,  delta = 0.55, kappa = 1.2 }
passenger_liner                = { cd_t = 0.90, cd_lAF_bow = 0.40, cd_lAF_stern = 0.40,  delta = 0.80, kappa = 1.2 }
research_vessel                = { cd_t = 0.85, cd_lAF_bow = 0.55, cd_lAF_stern = 0.65,  delta = 0.60, kappa = 1.4 }
speed_boat                     = { cd_t = 0.90, cd_lAF_bow = 0.55, cd_lAF_stern = 0.60,  delta = 0.60, kappa = 1.1 }
tanker_loaded                  = { cd_t = 0.70, cd_lAF_bow = 0.90, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 3.1 }
tanker_ballast                 = { cd_t = 0.70, cd_lAF_bow = 0.75, cd_lAF_stern = 0.55,  delta = 0.40, kappa = 2.2 }
tender                         = { cd_t = 0.85, cd_lAF_bow = 0.55, cd_lAF_stern = 0.55,  delta = 0.65, kappa = 1.1 }


# =====================================================================
#  CONTROL AND OBSERVER
# =====================================================================

# DP controller (controller/dp_controller.py): a PID that holds the vessel at
# the set-point. Gains from the diagonals of M and D in [vessel], one value
# per DOF [surge, sway, yaw]:
#   Kp = M wn^2,   Kd = 2 zeta wn M - D,   Ki = Kp wn / 10
[controller]
north_ref = 0.0                 # set-point north [m]
east_ref = 0.0                  # set-point east [m]
heading_ref_deg = 0.0           # set-point heading [deg]
natural_frequency = [0.05, 0.05, 0.05]          # wn [rad/s]; higher = faster. 0.05 = period of about 2 min
damping_ratio = [0.9, 0.9, 0.9]                 # zeta [-]; 1 = critically damped, lower = more overshoot
integral_force_limit = [3.0e5, 3.0e5, 1.0e7]    # anti-windup: max from the integral term [N, N, Nm]

# Extended Kalman filter (observer/ekf/ekf.py), LF + WF. All matrices diagonal.
#   State order:       [north, east, psi, u, v, r, b_x, b_y, b_n, xi_1 (3), xi_2 (3)]
#   Measurement order: [north, east, psi], the total LF + WF motion
# process_noise and initial_covariance below cover the first 9 (LF and bias)
# states; the WF states are set from wave_damping_ratio and wave_motion_std.
[kalman_filter]
bias_time_constants = [1000.0, 1000.0, 1000.0]  # T_b [s]
# Process noise Q, per second. Larger = trust the model less.
process_noise = [1e-4, 1e-4, 1e-6,   1e-4, 1e-4, 1e-7,   1e7, 1e7, 1e10]
# Measurement noise R = std^2: GNSS 0.5 m, gyro 0.5 deg.
measurement_noise = [0.25, 0.25, 7.6e-5]
# Initial covariance P0. The bias starts unknown: std 1e5 N, 1e6 Nm.
initial_covariance = [1.0, 1.0, 0.01,   0.1, 0.1, 1e-4,   1e10, 1e10, 1e12]
# Wave-frequency (WF) model, per DOF [north, east, yaw]. The peak frequency
# is 2 pi / tp from [waves]. Q and P0 of the WF states follow from these.
wave_damping_ratio = [0.1, 0.1, 0.1]            # lambda [-], typically 0.05-0.2
wave_motion_std = [0.5, 0.5, 0.01]              # expected std of the WF motion [m, m, rad]


# =====================================================================
#  THRUSTERS AND POWER
# =====================================================================
# Body frame, positions from the body origin (here Lpp/2). Power in kW.
# Every key is explained in thruster/helpfunctions/layout.py and docs/thruster_fmus.md.

[allocation]
flushing_sectors = true         # add the DNV-ST-0111 [3.11.3] flushing sectors (needs diameter)
# When the command is more than the thrusters can give: cost per N of error
# in X and Y, and per Nm in N. Equal weights keep the heading first.
tau_weights = [1.0, 1.0, 1.0]


# Switchboards. Leave out every [[power_sources]] for no power limit.
[[power_sources]]
name = "SWBD 1"
available_kw = 3600.0
reserve_fraction = 0.1          # share kept for other consumers

[[power_sources]]
name = "SWBD 2"
available_kw = 3600.0
reserve_fraction = 0.1


# Made-up ~80 m PSV (the DNV-ST-0111 project's test vessel, mirrored into
# this frame). max_thrust = DNV [3.9.2] nominal thrust, rounded to 100 N.
# Time constants and turn rates are made up but typical; leave them out
# for a thruster that follows its command at once.
#
# The order matters: the k-th [[thrusters]] entry is slot k in the FMUs
# (thruster1_..., thruster2_...). At most 8 thrusters.

[[thrusters]]
name = "AZ1"                    # port azimuth
kind = "azimuth"                # "azimuth", "tunnel" or "shaft_line"
x = -40.0                       # [m]
y = -5.5                        # [m]
max_thrust = 377500.0           # [N]
diameter = 3.0                  # [m]
power_kw = 2000.0               # power at max_thrust [kW]
power_supply = [["SWBD 1", 1.0]]
thrust_time_constant = 5.0      # first-order lag of the thrust [s]
max_azimuth_rate = 10.0         # fastest it turns [deg/s]

[[thrusters]]
name = "AZ2"                    # starboard azimuth
kind = "azimuth"
x = -40.0
y = 5.5
max_thrust = 377500.0
diameter = 3.0
power_kw = 2000.0
power_supply = [["SWBD 2", 1.0]]
thrust_time_constant = 5.0
max_azimuth_rate = 10.0

[[thrusters]]
name = "BT1"                    # bow tunnel; positive thrust pushes to starboard
kind = "tunnel"
x = 31.0
y = 0.0
max_thrust = 135800.0
diameter = 2.0
power_kw = 900.0
power_supply = [["SWBD 1", 1.0]]
thrust_time_constant = 3.0

[[thrusters]]
name = "BT2"                    # bow tunnel
kind = "tunnel"
x = 28.0
y = 0.0
max_thrust = 126900.0
diameter = 2.0
power_kw = 900.0
power_supply = [["SWBD 2", 1.0]]
thrust_time_constant = 3.0


